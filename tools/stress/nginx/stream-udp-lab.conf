# UDP stream proxy — lab topology (matches mbuf_fixture / pktgen bench).
worker_processes 1;
worker_rlimit_nofile 65535;
error_log stderr warn;
pid /tmp/fg-nginx-lab.pid;

events {
    worker_connections 8192;
}

stream {
    upstream fg_upstream {
        server 10.1.0.2:53;
    }

    server {
        listen 192.168.1.100:53 udp reuseport;
        proxy_pass fg_upstream;
        proxy_timeout 10s;
        proxy_responses 1;
    }
}
